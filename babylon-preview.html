<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>REAL ARENA | Blender × Babylon.js</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09141d;color:#edf7fb}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:2;top:18px;left:18px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:14px}
.brand,.status,.controls{background:rgba(8,20,29,.74);border:1px solid rgba(200,231,244,.16);backdrop-filter:blur(18px);box-shadow:0 10px 36px rgba(0,0,0,.2)}
.brand{padding:13px 16px;border-radius:14px}.eyebrow{font-size:10px;letter-spacing:.22em;color:#8ed5e7;font-weight:800}.brand h1{font-size:17px;margin:5px 0 2px;letter-spacing:.08em}.brand p{font-size:11px;margin:0;color:#a8c0cc}
.status{padding:10px 13px;border-radius:12px;font-size:11px;color:#b9d2dc;max-width:48vw;line-height:1.5}
.controls{position:fixed;z-index:3;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:9px;border-radius:15px;max-width:calc(100vw - 24px)}
button{border:1px solid rgba(205,232,242,.18);background:rgba(29,52,65,.92);color:#eaf6fa;border-radius:9px;padding:10px 13px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
button.active,button:hover{background:#0b8195;border-color:#58cfe0}
.note{position:fixed;right:18px;bottom:22px;color:#a7c1cb;font-size:10px;z-index:2;pointer-events:none}
@media(max-width:700px){.hud{top:9px;left:9px;right:9px}.brand{padding:9px 11px}.brand h1{font-size:13px}.brand p{font-size:9px}.eyebrow{font-size:8px}.status{font-size:9px;padding:8px;max-width:48vw}.controls{bottom:9px;gap:5px;padding:7px}button{padding:8px 9px;font-size:10px}.note{display:none}}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<canvas id="renderCanvas" aria-label="3D sports arena preview"></canvas>
<div class="hud">
 <div class="brand"><div class="eyebrow">REAL-TIME VENUE STUDY</div><h1>REAL ARENA</h1><p>BLENDER MODEL × BABYLON.JS</p></div>
 <div id="status" class="status">3D会場モデルを読み込んでいます…</div>
</div>
<div class="controls">
 <button id="broadcast" class="active">中継カメラ</button><button id="wide">会場全体</button><button id="court">コート視点</button><button id="lights" class="active">照明 ON</button><button id="reset">視点リセット</button>
</div>
<div class="note">ドラッグ：回転　ピンチ／ホイール：ズーム</div>
<script>
(async () => {
 const canvas=document.getElementById("renderCanvas");
 const status=document.getElementById("status");
 const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true,powerPreference:"high-performance"});
 const scene=new BABYLON.Scene(engine);
 scene.clearColor=new BABYLON.Color4(.025,.055,.078,1);
 scene.ambientColor=new BABYLON.Color3(.12,.14,.16);
 scene.imageProcessingConfiguration.toneMappingEnabled=true;
 scene.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
 scene.imageProcessingConfiguration.exposure=.92;
 scene.imageProcessingConfiguration.contrast=1.18;
 scene.environmentTexture=BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/environmentSpecular.env",scene);
 scene.environmentIntensity=.32;
 const camera=new BABYLON.ArcRotateCamera("camera",0,1.14,54,new BABYLON.Vector3(0,5.0,0),scene);
 camera.attachControl(canvas,true);camera.lowerRadiusLimit=10;camera.upperRadiusLimit=95;camera.wheelPrecision=38;camera.panningSensibility=55;camera.inertia=.78;
 scene.activeCamera=camera;
 const hemi=new BABYLON.HemisphericLight("ambient",new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.62;hemi.groundColor=new BABYLON.Color3(.075,.09,.105);
 const key=new BABYLON.DirectionalLight("arena-key",new BABYLON.Vector3(-.45,-1,.35),scene);key.position=new BABYLON.Vector3(-18,28,20);key.intensity=1.45;
 const fill=new BABYLON.DirectionalLight("arena-fill",new BABYLON.Vector3(.6,-.65,-.4),scene);fill.position=new BABYLON.Vector3(18,22,-20);fill.intensity=.58;
 const shadow=new BABYLON.ShadowGenerator(2048,key);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=24;shadow.bias=.0005;shadow.normalBias=.025;
 function pbr(name,color,rough=.7,metal=0){const m=new BABYLON.PBRMaterial(name,scene);m.albedoColor=BABYLON.Color3.FromHexString(color);m.roughness=rough;m.metallic=metal;return m}
 const apronMat=pbr("Court apron","#243943",.75,.03);
 const apron=BABYLON.MeshBuilder.CreateGround("court-apron",{width:14.4,height:28},scene);apron.position.y=-.12;apron.material=apronMat;apron.receiveShadows=true;
 const floor=BABYLON.MeshBuilder.CreateGround("arena-floor",{width:64,height:76},scene);floor.position.y=-.48;floor.material=pbr("Arena floor","#465155",.94);floor.receiveShadows=true;
 const courtMat=pbr("Competition court","#0d4654",.5,.01);
 courtMat.clearCoat.isEnabled=true;courtMat.clearCoat.intensity=.22;courtMat.clearCoat.roughness=.38;
 const court=BABYLON.MeshBuilder.CreateGround("interactive-court",{width:10.97,height:23.77,subdivisions:1},scene);court.position.y=.015;court.material=courtMat;court.receiveShadows=true;
 // Premium competition-zone dressing: layered court apron, access lanes, LED boards and team areas.
 const matRubber=pbr("Competition apron rubber","#202a30",.84,.02);
 const matEdge=pbr("Apron edge graphite","#11191f",.58,.18);
 const matLane=pbr("Walkway resin","#303a40",.76,.04);
 const matMetal=pbr("Brushed arena trim","#68777b",.32,.68);
 const matBoard=pbr("LED advertising glass","#061016",.24,.22);
 const matSeat=pbr("Players bench upholstery","#172c35",.62,.01);
 const matWood=pbr("Bench timber trim","#6a5540",.48,.12);
 const matWhite=pbr("Warm white markings","#c8d0cb",.68,.02);
 // Layered floor creates a deliberate transition from playing surface to venue floor.
 const apronBase=BABYLON.MeshBuilder.CreateGround("competition-zone-base",{width:18.8,height:32.2},scene);
 apronBase.position.y=-.105;apronBase.material=matEdge;apronBase.receiveShadows=true;
 const apronTop=BABYLON.MeshBuilder.CreateGround("competition-zone-surface",{width:18.1,height:31.5},scene);
 apronTop.position.y=-.082;apronTop.material=matRubber;apronTop.receiveShadows=true;
 const walkNorth=BABYLON.MeshBuilder.CreateGround("north-service-walkway",{width:26,height:5.2},scene);
 walkNorth.position.set(0,-.075,-18.7);walkNorth.material=matLane;walkNorth.receiveShadows=true;
 const walkSouth=BABYLON.MeshBuilder.CreateGround("south-service-walkway",{width:26,height:5.2},scene);
 walkSouth.position.set(0,-.075,18.7);walkSouth.material=matLane;walkSouth.receiveShadows=true;
 function trimBox(name,x,y,z,w,h,d,mat){const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);m.position.set(x,y,z);m.material=mat;m.receiveShadows=true;return m}
 // Flush inset perimeter strips and corner markers, not oversized bright outlines.
 for(const x of [-7.35,7.35]) trimBox("apron-perimeter-inlay",x,-.062,0,.035,.012,27.9,matMetal);
 for(const z of [-14.05,14.05]) trimBox("apron-perimeter-inlay",0,-.062,z,14.75,.012,.035,matMetal);
 for(const x of [-7.25,7.25]) for(const z of [-13.95,13.95]) {
   const marker=trimBox("corner-floor-marker",x,-.055,z,.28,.014,.28,matWhite);
 }
 // Low courtside LED boards, with dark bezels and subtle cyan/white content bands.
 function ledBoard(name,x,z,w,d,rot=0){
   const root=new BABYLON.TransformNode(name+"-root",scene);root.position.set(x,.36,z);root.rotation.y=rot;
   const bezel=trimBox(name+"-bezel",0,0,0,w,.72,d,matEdge);bezel.parent=root;bezel.position.set(0,0,0);
   const face=trimBox(name+"-screen",0,.015,0,w-.12,.49,d+.018,matBoard);face.parent=root;face.position.set(0,.035,0);
   const stripe=trimBox(name+"-brand-stripe",0,-.19,0,w-.18,.035,d+.03,matMetal);stripe.parent=root;stripe.position.set(0,-.19,0);
   for(let i=0;i<Math.floor(w/1.25);i++){
     const pixel=trimBox(name+"-screen-segment",-(w/2)+.45+i*1.25,.05,0,.42,.018,d+.04,(i%4===0?matMetal:matWhite));
     pixel.parent=root;pixel.position.set(-(w/2)+.45+i*1.25,.05,0);
   }
   return root;
 }
 ledBoard("north-courtside-display",0,-14.55,13.8,.22);
 ledBoard("south-courtside-display",0,14.55,13.8,.22);
 ledBoard("west-courtside-display",-6.95,0,.22,24,Math.PI/2);
 ledBoard("east-courtside-display",6.95,0,.22,24,Math.PI/2);
 // Team benches and equipment boxes on the service lanes.
 function bench(name,x,z,rot=0){
   const root=new BABYLON.TransformNode(name,scene);root.position.set(x,-.02,z);root.rotation.y=rot;
   const seat=trimBox(name+"-seat",0,.48,0,2.6,.16,.55,matSeat);seat.parent=root;seat.position.set(0,.48,0);
   const back=trimBox(name+"-back",0,.88,-.22,2.6,.62,.12,matSeat);back.parent=root;back.position.set(0,.88,-.22);
   for(const px of [-1.08,1.08]) for(const pz of [-.18,.18]){const leg=trimBox(name+"-leg",px,.21,pz,.07,.42,.07,matMetal);leg.parent=root;leg.position.set(px,.21,pz)}
   const trim=trimBox(name+"-front-trim",0,.39,.285,2.45,.045,.025,matWood);trim.parent=root;trim.position.set(0,.39,.285);
 }
 bench("home-team-bench",-4.3,-18.8);
 bench("away-team-bench",4.3,-18.8);
 // Compact officials' desk and camera platforms, kept low so the court remains visible.
 trimBox("officials-desk",0,.42,-21.0,3.2,.82,.78,matEdge);
 trimBox("officials-desk-top",0,.86,-21.0,3.28,.08,.84,matMetal);
 for(const x of [-1.25,1.25]) {
   trimBox("camera-platform",x,.12,21.1,1.35,.24,1.15,matEdge);
   trimBox("camera-platform-top",x,.255,21.1,1.28,.05,1.08,matMetal);
 }
 // Small access gates and queue rails beyond the run-off zone.
 for(const side of [-1,1]) {
   for(const z of [-20.8,-19.6,-18.4]) {
     trimBox("access-rail-post",side*9.4,.48,z,.07,.96,.07,matMetal);
   }
   trimBox("access-rail-top",side*9.4,.91,-19.6,.07,.06,2.5,matMetal);
 }
 const lineMat=new BABYLON.StandardMaterial("court-lines",scene);lineMat.diffuseColor=new BABYLON.Color3(.84,.87,.83);lineMat.emissiveColor=new BABYLON.Color3(.035,.04,.035);
 function line(name,x,z,w,d){const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:.018,depth:d},scene);m.position.set(x,.032,z);m.material=lineMat;return m}
 line("baseline north",0,-11.885,10.97,.05);line("baseline south",0,11.885,10.97,.05);
 line("sideline west",-5.485,0,.05,23.77);line("sideline east",5.485,0,.05,23.77);
 line("service line north",0,-6.4,10.97,.045);line("service line south",0,6.4,10.97,.045);
 line("center service line",0,0,.045,12.8);
 line("singles west",-4.115,0,.04,23.77);line("singles east",4.115,0,.04,23.77);
 const postMat=pbr("Net post metal","#25343b",.28,.75);
 for(const x of [-5.58,5.58]){const p=BABYLON.MeshBuilder.CreateCylinder("net-post",{height:1.12,diameter:.09,tessellation:24},scene);p.position.set(x,.56,0);p.material=postMat;p.receiveShadows=true}
 const netMat=new BABYLON.StandardMaterial("net-thread",scene);netMat.diffuseColor=new BABYLON.Color3(.78,.85,.86);netMat.emissiveColor=new BABYLON.Color3(.07,.08,.08);netMat.alpha=.72;
 const netLines=[];
 for(let i=0;i<=80;i++){const x=-5.5+i*11/80;const sag=Math.pow(x/5.5,2)*.11;netLines.push(BABYLON.MeshBuilder.CreateLines("net-vertical",{points:[new BABYLON.Vector3(x,.08,0),new BABYLON.Vector3(x,.91-sag,0)]},scene))}
 for(let j=0;j<=12;j++){const y=.08+j*.064;const pts=[];for(let i=0;i<=80;i++){const x=-5.5+i*11/80;pts.push(new BABYLON.Vector3(x,y-Math.pow(x/5.5,2)*.11*(y/.91),0))}netLines.push(BABYLON.MeshBuilder.CreateLines("net-horizontal",{points:pts},scene))}
 netLines.forEach(n=>n.color=new BABYLON.Color3(.68,.78,.8));
 const tape=BABYLON.MeshBuilder.CreateBox("net-top-tape",{width:11.08,height:.07,depth:.07},scene);tape.position.set(0,.93,0);tape.material=lineMat;
 let modelMeshes=[],modelReady=false,lightsOn=true;
 try{
   status.textContent="Blender製の会場モデルを読み込んでいます…";
   const result=await BABYLON.SceneLoader.ImportMeshAsync(null,"./assets/","realistic-arena.glb",scene,evt=>{if(evt.lengthComputable)status.textContent="会場モデルを読み込み中 "+Math.round(evt.loaded/evt.total*100)+"%";});
   modelMeshes=result.meshes.filter(m=>m.getTotalVertices&&m.getTotalVertices()>0);
   modelMeshes.forEach(m=>{m.receiveShadows=true;shadow.addShadowCaster(m);});
   modelReady=true;
   status.textContent="Blenderモデル読み込み完了。会場・照明・コートを確認できます。";
 }catch(err){
   console.error(err);
   status.textContent="会場モデルの生成待ちです。コート表示は確認できます。";
 }
 const presets={
  broadcast:{alpha:0,beta:1.26,radius:43,target:new BABYLON.Vector3(0,7.0,0)},
  wide:{alpha:0,beta:1.12,radius:69,target:new BABYLON.Vector3(0,8.0,0)},
  court:{alpha:0,beta:1.42,radius:29,target:new BABYLON.Vector3(0,2.5,0)}
 };
 function setView(name){const v=presets[name];camera.setTarget(v.target);camera.alpha=v.alpha;camera.beta=v.beta;camera.radius=v.radius;document.querySelectorAll("button[id=broadcast],button[id=wide],button[id=court]").forEach(b=>b.classList.toggle("active",b.id===name))}
 document.getElementById("broadcast").onclick=()=>setView("broadcast");
 document.getElementById("wide").onclick=()=>setView("wide");
 document.getElementById("court").onclick=()=>setView("court");
 document.getElementById("lights").onclick=e=>{lightsOn=!lightsOn;key.setEnabled(lightsOn);fill.setEnabled(lightsOn);e.currentTarget.classList.toggle("active",lightsOn);e.currentTarget.textContent="照明 "+(lightsOn?"ON":"OFF")};
 document.getElementById("reset").onclick=()=>setView("broadcast");
 engine.runRenderLoop(()=>scene.render());
 window.addEventListener("resize",()=>engine.resize());
})();
</script>
</body>
</html>
