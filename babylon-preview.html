<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>REAL ARENA | Blender × Babylon.js</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09141d;color:#edf7fb}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:2;top:18px;left:18px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:14px}
.brand,.status,.controls{background:rgba(8,20,29,.74);border:1px solid rgba(200,231,244,.16);backdrop-filter:blur(18px);box-shadow:0 10px 36px rgba(0,0,0,.2)}
.brand{padding:13px 16px;border-radius:14px}.eyebrow{font-size:10px;letter-spacing:.22em;color:#8ed5e7;font-weight:800}.brand h1{font-size:17px;margin:5px 0 2px;letter-spacing:.08em}.brand p{font-size:11px;margin:0;color:#a8c0cc}
.status{padding:10px 13px;border-radius:12px;font-size:11px;color:#b9d2dc;max-width:48vw;line-height:1.5}
.controls{position:fixed;z-index:3;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:9px;border-radius:15px;max-width:calc(100vw - 24px)}
button{border:1px solid rgba(205,232,242,.18);background:rgba(29,52,65,.92);color:#eaf6fa;border-radius:9px;padding:10px 13px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
button.active,button:hover{background:#0b8195;border-color:#58cfe0}
.note{position:fixed;right:18px;bottom:22px;color:#a7c1cb;font-size:10px;z-index:2;pointer-events:none}
@media(max-width:700px){.hud{top:9px;left:9px;right:9px}.brand{padding:9px 11px}.brand h1{font-size:13px}.brand p{font-size:9px}.eyebrow{font-size:8px}.status{font-size:9px;padding:8px;max-width:48vw}.controls{bottom:9px;gap:5px;padding:7px}button{padding:8px 9px;font-size:10px}.note{display:none}}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<canvas id="renderCanvas" aria-label="3D sports arena preview"></canvas>
<div class="hud">
 <div class="brand"><div class="eyebrow">REAL-TIME VENUE STUDY</div><h1>REAL ARENA</h1><p>BLENDER MODEL × BABYLON.JS</p></div>
 <div id="status" class="status">3D会場モデルを読み込んでいます…</div>
</div>
<div class="controls">
 <button id="broadcast" class="active">中継カメラ</button><button id="wide">会場全体</button><button id="court">コート視点</button><button id="lights" class="active">照明 ON</button><button id="reset">視点リセット</button>
</div>
<div class="note">ドラッグ：回転　ピンチ／ホイール：ズーム</div>
<script>
(async () => {
 const canvas=document.getElementById("renderCanvas");
 const status=document.getElementById("status");
 const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true,powerPreference:"high-performance"});
 const scene=new BABYLON.Scene(engine);
 scene.clearColor=new BABYLON.Color4(.025,.055,.078,1);
 scene.ambientColor=new BABYLON.Color3(.18,.2,.22);
 scene.imageProcessingConfiguration.toneMappingEnabled=true;
 scene.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
 scene.imageProcessingConfiguration.exposure=1.12;
 scene.imageProcessingConfiguration.contrast=1.12;
 scene.environmentTexture=BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/environmentSpecular.env",scene);
 scene.environmentIntensity=.48;
 const camera=new BABYLON.ArcRotateCamera("camera",-Math.PI/2,1.14,54,new BABYLON.Vector3(0,5.5,0),scene);
 camera.attachControl(canvas,true);camera.lowerRadiusLimit=18;camera.upperRadiusLimit=82;camera.wheelPrecision=38;camera.panningSensibility=55;camera.inertia=.78;
 scene.activeCamera=camera;
 const hemi=new BABYLON.HemisphericLight("ambient",new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.8;hemi.groundColor=new BABYLON.Color3(.12,.15,.18);
 const key=new BABYLON.DirectionalLight("arena-key",new BABYLON.Vector3(-.45,-1,.35),scene);key.position=new BABYLON.Vector3(-18,28,20);key.intensity=2.1;
 const fill=new BABYLON.DirectionalLight("arena-fill",new BABYLON.Vector3(.6,-.65,-.4),scene);fill.position=new BABYLON.Vector3(18,22,-20);fill.intensity=.95;
 const shadow=new BABYLON.ShadowGenerator(1024,key);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=20;shadow.bias=.0003;
 function pbr(name,color,rough=.7,metal=0){const m=new BABYLON.PBRMaterial(name,scene);m.albedoColor=BABYLON.Color3.FromHexString(color);m.roughness=rough;m.metallic=metal;return m}
 const apronMat=pbr("Court apron","#243943",.75,.03);
 const apron=BABYLON.MeshBuilder.CreateGround("court-apron",{width:14.4,height:28},scene);apron.position.y=-.12;apron.material=apronMat;apron.receiveShadows=true;
 const floor=BABYLON.MeshBuilder.CreateGround("arena-floor",{width:64,height:76},scene);floor.position.y=-.48;floor.material=pbr("Arena floor","#68777a",.91);floor.receiveShadows=true;
 const courtMat=pbr("Competition court","#155e70",.42,.02);
 courtMat.clearCoat.isEnabled=true;courtMat.clearCoat.intensity=.22;courtMat.clearCoat.roughness=.38;
 const court=BABYLON.MeshBuilder.CreateGround("interactive-court",{width:10.97,height:23.77,subdivisions:1},scene);court.position.y=.015;court.material=courtMat;court.receiveShadows=true;
 const lineMat=new BABYLON.StandardMaterial("court-lines",scene);lineMat.diffuseColor=new BABYLON.Color3(.92,.95,.91);lineMat.emissiveColor=new BABYLON.Color3(.12,.13,.12);
 function line(name,x,z,w,d){const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:.018,depth:d},scene);m.position.set(x,.032,z);m.material=lineMat;return m}
 line("baseline north",0,-11.885,10.97,.05);line("baseline south",0,11.885,10.97,.05);
 line("sideline west",-5.485,0,.05,23.77);line("sideline east",5.485,0,.05,23.77);
 line("service line north",0,-6.4,10.97,.045);line("service line south",0,6.4,10.97,.045);
 line("center service line",0,0,.045,12.8);
 line("singles west",-4.115,0,.04,23.77);line("singles east",4.115,0,.04,23.77);
 const postMat=pbr("Net post metal","#25343b",.28,.75);
 for(const x of [-5.58,5.58]){const p=BABYLON.MeshBuilder.CreateCylinder("net-post",{height:1.12,diameter:.09,tessellation:24},scene);p.position.set(x,.56,0);p.material=postMat;p.receiveShadows=true}
 const netMat=new BABYLON.StandardMaterial("net-thread",scene);netMat.diffuseColor=new BABYLON.Color3(.78,.85,.86);netMat.emissiveColor=new BABYLON.Color3(.07,.08,.08);netMat.alpha=.72;
 const netLines=[];
 for(let i=0;i<=80;i++){const x=-5.5+i*11/80;const sag=Math.pow(x/5.5,2)*.11;netLines.push(BABYLON.MeshBuilder.CreateLines("net-vertical",{points:[new BABYLON.Vector3(x,.08,0),new BABYLON.Vector3(x,.91-sag,0)]},scene))}
 for(let j=0;j<=12;j++){const y=.08+j*.064;const pts=[];for(let i=0;i<=80;i++){const x=-5.5+i*11/80;pts.push(new BABYLON.Vector3(x,y-Math.pow(x/5.5,2)*.11*(y/.91),0))}netLines.push(BABYLON.MeshBuilder.CreateLines("net-horizontal",{points:pts},scene))}
 netLines.forEach(n=>n.color=new BABYLON.Color3(.68,.78,.8));
 const tape=BABYLON.MeshBuilder.CreateBox("net-top-tape",{width:11.08,height:.07,depth:.07},scene);tape.position.set(0,.93,0);tape.material=lineMat;
 let modelMeshes=[],modelReady=false,lightsOn=true;
 try{
   status.textContent="Blender製の会場モデルを読み込んでいます…";
   const result=await BABYLON.SceneLoader.ImportMeshAsync(null,"./assets/","realistic-arena.glb",scene,evt=>{if(evt.lengthComputable)status.textContent="会場モデルを読み込み中 "+Math.round(evt.loaded/evt.total*100)+"%";});
   modelMeshes=result.meshes.filter(m=>m.getTotalVertices&&m.getTotalVertices()>0);
   modelMeshes.forEach(m=>{m.receiveShadows=true;shadow.addShadowCaster(m);});
   modelReady=true;
   status.textContent="Blenderモデル読み込み完了。会場・照明・コートを確認できます。";
 }catch(err){
   console.error(err);
   status.textContent="会場モデルの生成待ちです。コート表示は確認できます。";
 }
 const presets={
  broadcast:{alpha:-Math.PI/2,beta:1.30,radius:48,target:new BABYLON.Vector3(0,5.2,0)},
  wide:{alpha:-Math.PI/2,beta:1.18,radius:66,target:new BABYLON.Vector3(0,7.0,0)},
  court:{alpha:-Math.PI/2,beta:1.42,radius:32,target:new BABYLON.Vector3(0,1.8,0)}
 };
 function setView(name){const v=presets[name];camera.setTarget(v.target);camera.alpha=v.alpha;camera.beta=v.beta;camera.radius=v.radius;document.querySelectorAll("button[id=broadcast],button[id=wide],button[id=court]").forEach(b=>b.classList.toggle("active",b.id===name))}
 document.getElementById("broadcast").onclick=()=>setView("broadcast");
 document.getElementById("wide").onclick=()=>setView("wide");
 document.getElementById("court").onclick=()=>setView("court");
 document.getElementById("lights").onclick=e=>{lightsOn=!lightsOn;key.setEnabled(lightsOn);fill.setEnabled(lightsOn);e.currentTarget.classList.toggle("active",lightsOn);e.currentTarget.textContent="照明 "+(lightsOn?"ON":"OFF")};
 document.getElementById("reset").onclick=()=>setView("broadcast");
 engine.runRenderLoop(()=>scene.render());
 window.addEventListener("resize",()=>engine.resize());
})();
</script>
</body>
</html>
