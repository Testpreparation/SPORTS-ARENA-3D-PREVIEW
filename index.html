function view(v){orbit.target.set(0,.6,0);if(v==='play'){camera.position.set(4.5,7,21);orbit.target.set(0,.6,-1.2)}else if(v==='top'){camera.position.set(0,25,3.8)}else{camera.position.set(0,2.6,22)}orbit.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
[['play','play'],['topview','top'],['low','low']].forEach(([id,v])=>{document.getElementById(id).dataset.view=v;document.getElementById(id).onclick=()=>view(v)});
const venueStyles={standard:{title:'スタンダードコート',eyebrow:'ENVIRONMENT / 01'},stadium:{title:'テニススタジアム',eyebrow:'VENUE / STADIUM'},grand:{title:'大会スタジアム',eyebrow:'VENUE / CHAMPIONSHIP'},indoor:{title:'インドアアリーナ',eyebrow:'VENUE / INDOOR ARENA'},night:{title:'ナイトスタジアム',eyebrow:'VENUE / NIGHT SESSION'}};
let currentVenue='standard';
function setVenue(type){if(!venueStyles[type])return;currentVenue=type;venueGroup.visible=type!=='standard'&&type!=='stadium';stadiumGroup.visible=type==='stadium';seatGroup.visible=seatsOn&&type==='standard';indoorRoofGroup.visible=type==='indoor';championshipGroup.visible=type==='grand';if(type==='standard'){camera.position.set(4.5,7,21);orbit.target.set(0,.6,-1.2)}else if(type==='indoor'){camera.position.set(0,17,39);orbit.target.set(0,3,0)}else if(type==='stadium'){camera.position.set(0,21,43);orbit.target.set(0,4.5,0)}else{camera.position.set(0,17,39);orbit.target.set(0,3,0)}orbit.update();venueGroup.traverse(o=>{if(o.material&&o.material.emissive&&o.material===ledMat)o.material.emissiveIntensity=type==='night'?2.4:.8});
scene.background.set(type==='night'?0x071522:type==='indoor'?0x526b7b:0x9fb8c5);scene.fog.color.set(type==='night'?0x071522:type==='indoor'?0x526b7b:0x9fb8c5);
sun.intensity=type==='night'?.35:type==='indoor'?1.5:3.2;fill.intensity=type==='night'?.35:1.15;spotlights.forEach(s=>{s.intensity=lightsOn?(type==='night'?3.5:type==='indoor'?1.3:2):0});
document.querySelectorAll('[data-venue]').forEach(b=>b.classList.toggle('active',b.dataset.venue===type));document.querySelector('.panel h1').textContent=venueStyles[type].title;document.querySelector('.panel .eyebrow').textContent=venueStyles[type].eyebrow;
}
document.querySelectorAll('[data-venue]').forEach(b=>b.addEventListener('click',()=>setVenue(b.dataset.venue)));
const courtStyles={hard:{apron:0x244454,title:'ハードコート'},clay:{apron:0x7d3827,title:'クレーコート'},grass:{apron:0x254d35,title:'芝コート'},indoor:{apron:0x6e5134,title:'インドアコート'}};
function setCourtType(type){if(!surfaceTextures[type])return;courtMaterial.map=surfaceTextures[type].map;courtMaterial.roughnessMap=surfaceTextures[type].roughnessMap;courtMaterial.bumpMap=surfaceTextures[type].bumpMap;courtMaterial.normalMap=surfaceTextures[type].normalMap;courtMaterial.roughness=type==='indoor'?.48:type==='hard'?.64:type==='clay'?.9:.82;courtMaterial.clearcoat=type==='indoor'?.34:type==='hard'?.24:type==='clay'?.04:.08;courtMaterial.clearcoatRoughness=type==='indoor'?.24:type==='hard'?.34:.7;courtMaterial.envMapIntensity=type==='indoor'?1.05:type==='hard'?.82:.45;courtMaterial.bumpScale=type==='grass'?.032:type==='clay'?.024:.012;courtMaterial.normalScale.set(type==='grass'?.65:.42,type==='grass'?.65:.42);courtMaterial.needsUpdate=true;apronMat.color.setHex(courtStyles[type].apron);document.querySelectorAll('[data-court]').forEach(b=>b.classList.toggle('active',b.dataset.court===type));document.querySelector('.panel h1').textContent=courtStyles[type].title;document.querySelector('.panel .eyebrow').textContent='ENVIRONMENT / '+({hard:'01',clay:'02',grass:'03',indoor:'04'}[type]);}
document.querySelectorAll('[data-court]').forEach(b=>b.addEventListener('click',()=>setCourtType(b.dataset.court)));
let seatsOn=true,lightsOn=true;document.getElementById('seats').onclick=e=>{seatsOn=!seatsOn;seatGroup.visible=seatsOn&&currentVenue==='standard';e.currentTarget.classList.toggle('active',seatsOn);e.currentTarget.textContent='観客席 '+(seatsOn?'ON':'OFF')};document.getElementById('lights').onclick=e=>{lightsOn=!lightsOn;spotlights.forEach(s=>s.intensity=lightsOn?2:0);e.currentTarget.classList.toggle('active',lightsOn);e.currentTarget.textContent='照明 '+(lightsOn?'ON':'OFF')};document.getElementById('reset').onclick=()=>{view('play');orbit.reset();setVenue('standard');setCourtType('hard')};
function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;if(innerWidth<innerHeight&&innerWidth<=800){camera.fov=55;camera.position.set(0,12,27);orbit.target.set(0,.6,0)}else{camera.fov=43}camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));orbit.update()});if(innerWidth<innerHeight&&innerWidth<=800){camera.fov=55;camera.position.set(0,12,27);camera.updateProjectionMatrix();orbit.target.set(0,.6,0);orbit.update()}
</script>
