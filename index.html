<script>
(() => {
'use strict';
const canvas=document.getElementById('renderCanvas');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true,powerPreference:'high-performance'},true);
engine.setHardwareScalingLevel(Math.min(1.35,Math.max(1,window.devicePixelRatio/1.5)));
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.48,.62,.69,1);
scene.imageProcessingConfiguration.toneMappingEnabled=true;
scene.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
scene.imageProcessingConfiguration.exposure=1.12;
scene.imageProcessingConfiguration.contrast=1.12;
const camera=new BABYLON.ArcRotateCamera('camera',-Math.PI/2.18,1.05,43,new BABYLON.Vector3(0,2,0),scene);
camera.lowerRadiusLimit=19;camera.upperRadiusLimit=76;camera.lowerBetaLimit=.22;camera.upperBetaLimit=1.48;camera.wheelPrecision=36;camera.panningSensibility=0;camera.attachControl(canvas,true);
const hemi=new BABYLON.HemisphericLight('ambient',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.68;hemi.groundColor=new BABYLON.Color3(.22,.25,.28);
const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.45,-1,-.38),scene);sun.position=new BABYLON.Vector3(20,35,18);sun.intensity=2.05;
const shadows=new BABYLON.ShadowGenerator(2048,sun);shadows.useBlurExponentialShadowMap=true;shadows.blurKernel=24;shadows.setDarkness(.28);
const root=new BABYLON.TransformNode('arenaRoot',scene);
const courtRoot=new BABYLON.TransformNode('courtRoot',scene);courtRoot.parent=root;
const architecture=new BABYLON.TransformNode('architecture',scene);architecture.parent=root;
const seatRoot=new BABYLON.TransformNode('seatRoot',scene);seatRoot.parent=root;
const lightRoot=new BABYLON.TransformNode('lightRoot',scene);lightRoot.parent=root;
const modelArchitectureRoot=new BABYLON.TransformNode('blenderArchitecture',scene);modelArchitectureRoot.parent=root;
const modelSeatRoot=new BABYLON.TransformNode('blenderSeating',scene);modelSeatRoot.parent=root;
const mats={};
function mat(name,color,rough=.7,metal=0){const m=new BABYLON.PBRMaterial(name,scene);m.albedoColor=BABYLON.Color3.FromHexString(color);m.roughness=rough;m.metallic=metal;return m;}
mats.concrete=mat('Architectural concrete','#858e91',.88);mats.darkConcrete=mat('Deep concrete','#343f45',.8);mats.metal=mat('Brushed structural steel','#667982',.28,.78);mats.darkMetal=mat('Dark steel','#202d35',.32,.72);mats.glass=mat('Blue tinted architectural glass','#83b7c6',.16,.35);mats.glass.alpha=.3;mats.glass.transparencyMode=BABYLON.Material.MATERIAL_ALPHABLEND;mats.seat=mat('Moulded stadium seats','#177b9b',.32,.12);mats.seatAlt=mat('Alternate stadium seats','#d3e2e6',.35,.05);mats.white=mat('Court marking paint','#f5f7f2',.55);mats.trim=mat('Arena fascia','#172c3a',.4,.45);mats.gold=mat('Warm metal trim','#b6a16f',.28,.7);mats.rubber=mat('Rubber base','#17242a',.9);mats.emergency=mat('Exit sign','#b8ffca',.32);mats.emergency.emissiveColor=new BABYLON.Color3(.05,.7,.18);
function addBox(name,parent,pos,scale,material,opts={}){const m=BABYLON.MeshBuilder.CreateBox(name,{width:scale[0],height:scale[1],depth:scale[2]},scene);m.position.set(pos[0],pos[1],pos[2]);m.parent=parent;m.material=material;if(opts.cast!==false)shadows.addShadowCaster(m);if(opts.receive!==false)m.receiveShadows=true;return m;}
function addCylinder(name,parent,pos,diam,height,material,segments=12){const m=BABYLON.MeshBuilder.CreateCylinder(name,{diameter:diam,height,tessellation:segments},scene);m.position.set(pos[0],pos[1],pos[2]);m.parent=parent;m.material=material;shadows.addShadowCaster(m);return m;}
function addLine(name,parent,a,b,r,material){const A=new BABYLON.Vector3(...a),B=new BABYLON.Vector3(...b),d=B.subtract(A);const m=BABYLON.MeshBuilder.CreateCylinder(name,{height:d.length(),diameter:r,tessellation:8},scene);m.position=A.add(B).scale(.5);const dir=d.normalize();const axis=BABYLON.Vector3.Cross(BABYLON.Axis.Y,dir);const dot=BABYLON.Scalar.Clamp(BABYLON.Vector3.Dot(BABYLON.Axis.Y,dir),-1,1);m.rotationQuaternion=axis.lengthSquared()<1e-8?(dot>0?BABYLON.Quaternion.Identity():BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X,Math.PI)):BABYLON.Quaternion.RotationAxis(axis.normalize(),Math.acos(dot));m.parent=parent;m.material=material;shadows.addShadowCaster(m);return m;}
function makeCourtSurface(type){
 while(courtRoot.getChildren().length) courtRoot.getChildren()[0].dispose();
 let color='#287b9d',rough=.46,metal=.03;
 if(type==='clay'){color='#b65e3f';rough=.96;}if(type==='grass'){color='#39764b';rough=.88;}if(type==='wood'){color='#b58a59';rough=.32;}
 const floorMat=mat('Court surface '+type,color,rough,metal);
 floorMat.clearCoat.isEnabled=true;floorMat.clearCoat.intensity=type==='wood'?.36:.12;floorMat.clearCoat.roughness=.48;
 const base=addBox('Court foundation',courtRoot,[0,-.28,0],[12,.55,24],mats.rubber);
 const floor=addBox('Playing surface',courtRoot,[0,.01,0],[11.7,.12,23.7],floorMat);floor.receiveShadows=true;
 const apronMat=mat('Court apron '+type,type==='clay'?'#8f4a35':type==='grass'?'#285b3b':type==='wood'?'#76563b':'#1d5874',.76);
 addBox('Outer apron',courtRoot,[0,-.015,0],[14.7,.13,27.2],apronMat);
 // inset playable surface, boundary lines and service lines
 addBox('Inner playing surface',courtRoot,[0,.075,0],[10.97,.025,23.05],floorMat,{cast:false});
 const lineY=.096;
 function stripe(name,x,z,w,d){addBox(name,courtRoot,[x,lineY,z],[w,.018,d],mats.white,{cast:false,receive:false});}
 const half=11.43,side=4.12,service=6.4;
 stripe('North baseline',0,-half,10.95,.075);stripe('South baseline',0,half,10.95,.075);
 stripe('West sideline',-side,0,.07,22.86);stripe('East sideline',side,0,.07,22.86);
 stripe('Singles west',-3.16,0,.055,22.86);stripe('Singles east',3.16,0,.055,22.86);
 stripe('North service',0,-service,6.32,.055);stripe('South service',0,service,6.32,.055);
 stripe('Center service',0,0,.055,12.8);
 // tennis net, posts and mesh-like horizontal threads
 addCylinder('Net post west',courtRoot,[-4.18,.67,0],.13,1.3,mats.darkMetal);
 addCylinder('Net post east',courtRoot,[4.18,.67,0],.13,1.3,mats.darkMetal);
 const netMat=mat('Net dark braided material','#17272c',.96);
 addBox('Net tape',courtRoot,[0,1.28,0],[8.45,.09,.09],mats.white);
 const net=BABYLON.MeshBuilder.CreatePlane('Fine tennis net',{width:8.3,height:1.22},scene);net.position.set(0,.68,0);net.rotation.y=Math.PI/2;net.parent=courtRoot;net.material=netMat;net.material.backFaceCulling=false;
 for(let z=-.59;z<=.59;z+=.09)addBox('Net vertical weave',courtRoot,[0,.68+z,0],[8.25,.009,.012],mats.darkMetal,{cast:false,receive:false});
 for(let x=-4.1;x<=4.1;x+=.11)addBox('Net horizontal weave',courtRoot,[x,.68,0],[.008,1.18,.012],mats.darkMetal,{cast:false,receive:false});
}
function buildArchitecture(){
 addBox('Arena base plinth',architecture,[0,-.65,0],[31,.75,43],mats.darkConcrete);
 addBox('Main concourse mass',architecture,[0,1.0,0],[28,.9,38],mats.concrete);
 // layered seating bowl around court, open center
 for(let tier=0;tier<5;tier++){
  const y=.55+tier*.56,innerX=7.5+tier*.95,outerX=12.6+tier*.95,innerZ=12.1+tier*1.35,outerZ=17.2+tier*1.35;
  for(const side of [-1,1]){
   addBox('Tier riser '+tier,architecture,[side*(innerX+outerX)/2,y,(innerZ+outerZ)/2],[outerX-innerX,.22,outerZ-innerZ],mats.darkConcrete);
   addBox('Tier front fascia '+tier,architecture,[side*(innerX+.1),y+.12,(innerZ+outerZ)/2],[.12,.2,outerZ-innerZ],mats.metal);
  }
  for(const side of [-1,1]){
   addBox('End stand riser '+tier,architecture,[0,y,side*(innerZ+outerZ)/2],[outerX-innerX,.22,outerZ-innerZ],mats.darkConcrete);
  }
 }
 // structural pillars, beams and roof trusses
 for(const x of [-14,-10,-6,6,10,14])for(const z of [-19,-14,14,19]){
  addBox('Steel column',architecture,[x,5.7,z],[.28,10.5,.32],mats.metal);
  addBox('Column base plate',architecture,[x,.65,z],[.62,.12,.66],mats.darkMetal);
 }
 for(let z=-20;z<=20;z+=4){
  addBox('Roof cross beam',architecture,[0,11.1,z],[30,.22,.3],mats.darkMetal);
  addLine('Roof diagonal A',architecture,[-14,10.9,z],[0,12.7,z+2],.13,mats.metal);
  addLine('Roof diagonal B',architecture,[0,12.7,z+2],[14,10.9,z],.13,mats.metal);
  addBox('Roof rib cap',architecture,[0,12.83,z+1],[.28,.12,3.9],mats.gold);
 }
 addBox('Roof canopy',architecture,[0,13.25,0],[31,.5,43],mats.trim);
 // segmented glazed facade with mullions and entry doors
 for(const side of [-1,1]){
  for(let z=-18;z<=18;z+=2.4){
   addBox('Facade glass bay',architecture,[side*14.15,2.6,z],[.06,3.3,2.22],mats.glass,{cast:false});
   addBox('Facade mullion',architecture,[side*14.21,2.6,z-1.14],[.12,3.5,.09],mats.metal);
   addBox('Facade transom',architecture,[side*14.21,3.9,z],[.12,.09,2.3],mats.metal);
  }
  for(let z of [-12,0,12]){
   addBox('Double entrance door',architecture,[side*14.24,1.9,z],[.08,2.45,1.6],mats.darkMetal);
   addBox('Door glazing',architecture,[side*14.29,2.1,z],[.035,1.85,1.35],mats.glass,{cast:false});
   addBox('Door push plate',architecture,[side*14.32,1.5,z+.48],[.025,.35,.06],mats.gold,{cast:false});
  }
  for(let z=-16;z<=16;z+=4){
   addBox('Ventilation grille',architecture,[side*14.25,4.55,z],[.07,.42,1.25],mats.darkMetal);
   for(let j=0;j<6;j++)addBox('Vent slat',architecture,[side*14.3,4.4+j*.055,z],[.035,.018,1.12],mats.metal,{cast:false});
  }
 }
 // perimeter fascia, LED strips, scoreboard
 addBox('Scoreboard housing',architecture,[0,8.1,-17.9],[10,2.3,.5],mats.darkMetal);
 const boardMat=mat('Scoreboard luminous display','#123544',.3,.15);boardMat.emissiveColor=new BABYLON.Color3(.015,.12,.17);
 addBox('Scoreboard display',architecture,[0,8.1,-17.59],[9.45,1.72,.06],boardMat,{cast:false});
 for(let x=-4;x<=4;x+=.6)addBox('Scoreboard segment',architecture,[x,8.15,-17.54],[.035,1.2,.02],mats.emergency,{cast:false});
 for(const z of [-20.5,20.5])addBox('LED fascia strip',architecture,[0,9.6,z],[28,.08,.12],mats.gold,{cast:false});
 // handrails along upper tiers
 for(const side of [-1,1])for(let z=-17;z<=17;z+=.7){
  addBox('Railing post',architecture,[side*12.8,4.25,z],[.055,.7,.055],mats.metal,{cast:false});
 }
 for(const side of [-1,1])addBox('Railing top bar',architecture,[side*12.8,4.6,0],[.07,.07,34],mats.metal);
}
function buildSeats(){
 const seatBase=BABYLON.MeshBuilder.CreateBox('Seat prototype',{width:.38,height:.18,depth:.34},scene);seatBase.material=mats.seat;
 const seatBack=BABYLON.MeshBuilder.CreateBox('Seat back prototype',{width:.38,height:.3,depth:.07},scene);seatBack.material=mats.seat;
 const seatLeg=BABYLON.MeshBuilder.CreateBox('Seat leg prototype',{width:.055,height:.18,depth:.06},scene);seatLeg.material=mats.darkMetal;
 let count=0;
 for(let row=0;row<7;row++){
  const y=1.05+row*.53;
  for(let z=-17.2;z<=17.2;z+=.72){
   for(const side of [-1,1]){
    const x=side*(8.5+row*.78);
    const a=seatBase.createInstance('seat '+count);a.position.set(x,y,z);a.parent=seatRoot;
    const b=seatBack.createInstance('seat back '+count);b.position.set(x,y+.19,z-.13);b.parent=seatRoot;
    const l=seatLeg.createInstance('seat leg '+count);l.position.set(x-.12,y-.13,z);l.parent=seatRoot;
    const l2=seatLeg.createInstance('seat leg '+count);l2.position.set(x+.12,y-.13,z);l2.parent=seatRoot;
    count++;
   }
  }
  for(let x=-10.7;x<=10.7;x+=.72){
   for(const side of [-1,1]){
    const z=side*(13.4+row*.65);
    const a=seatBase.createInstance('end seat '+count);a.position.set(x,y,z);a.parent=seatRoot;
    const b=seatBack.createInstance('end seat back '+count);b.position.set(x,y+.19,z-side*.13);b.parent=seatRoot;b.rotation.y=side===1?Math.PI:0;
    const l=seatLeg.createInstance('end seat leg '+count);l.position.set(x,y-.13,z);l.parent=seatRoot;count++;
   }
  }
 }
 seatBase.dispose();seatBack.dispose();seatLeg.dispose();
}
function buildLights(){
 for(const side of [-1,1])for(const z of [-15,0,15]){
  const x=side*12.3;
  addBox('Floodlight tower base',lightRoot,[x,6,z],[.38,8,.38],mats.darkMetal);
  addBox('Floodlight bank',lightRoot,[x,10.2,z],[1.9,.55,1.05],mats.metal);
  for(let i=0;i<5;i++)addBox('LED optic',lightRoot,[x-.72+i*.36,10.2,z-.55],[.22,.18,.035],glowMat);
 }
}
const glowMat=mat('LED lamp glow','#eaf9ff',.25);glowMat.emissiveColor=new BABYLON.Color3(.8,.92,1);
buildArchitecture();buildSeats();buildLights();makeCourtSurface('hard');
async function loadBlenderModel(file,targetRoot){
 const result=await BABYLON.SceneLoader.ImportMeshAsync("", "./assets/", file, scene);
 for(const mesh of result.meshes){
  if(!mesh.parent)mesh.parent=targetRoot;
  if(typeof mesh.getTotalVertices==="function"&&mesh.getTotalVertices()>0){
   mesh.receiveShadows=true;
   try{shadows.addShadowCaster(mesh);}catch(_){}
  }
 }
 return result;
}
const blenderModelPromise=(async()=>{
 const status=document.getElementById('venueDesc');
 try{
  status.textContent='Blenderで制作した高品質3D会場モデルを読み込んでいます…';
  await loadBlenderModel('arena-architecture.glb',modelArchitectureRoot);
  architecture.setEnabled(false);
  status.textContent=venueInfo[activeVenue][1];
 }catch(err){
  console.warn('Blender architecture model unavailable; using Babylon.js fallback scene.',err);
 }
 try{
  await loadBlenderModel('arena-seats.glb',modelSeatRoot);
  seatRoot.setEnabled(false);
  modelSeatRoot.setEnabled(seatsVisible);
 }catch(err){
  console.warn('Blender seating model unavailable; using procedural seating.',err);
 }
 if(document.getElementById('loading'))document.getElementById('loading').classList.add('hide');
})();
const venueInfo={standard:['標準','コートを中心に、すっきりした屋外スポーツ施設の構成。'],stadium:['スタジアム','大型スタンドと構造フレームを備えた開放感のある会場。'],grand:['大会会場','大規模な屋根構造、観客席、ガラス外壁、照明設備を備えたスポーツアリーナ。'],indoor:['屋内アリーナ','屋根と外壁に包まれた屋内競技施設の雰囲気。'],night:['ナイト','夜間照明と発光ディスプレイを強調したナイトイベント仕様。']};
let activeVenue='grand',activeSurface='hard',seatsVisible=true,lightsVisible=true;
function setVenue(v){
 activeVenue=v;const info=venueInfo[v];document.getElementById('venueTitle').textContent=info[0];document.getElementById('venueDesc').textContent=info[1];
 const night=v==='night';sun.intensity=night?.35:2.05;hemi.intensity=night?.24:.68;scene.clearColor=night?new BABYLON.Color4(.025,.055,.09,1):new BABYLON.Color4(.48,.62,.69,1);
 architecture.getChildMeshes().forEach(m=>{if(m.name==='Roof canopy')m.isVisible=v!=='standard';});
 document.querySelectorAll('[data-venue]').forEach(b=>b.classList.toggle('active',b.dataset.venue===v));
 camera.alpha=v==='standard'?-Math.PI/2.1:v==='stadium'?-Math.PI/2.5:v==='indoor'?-Math.PI/2.0:-Math.PI/2.18;
}
function setSurface(s){activeSurface=s;makeCourtSurface(s);document.querySelectorAll('[data-surface]').forEach(b=>b.classList.toggle('active',b.dataset.surface===s));}
document.querySelectorAll('[data-venue]').forEach(b=>b.addEventListener('click',()=>setVenue(b.dataset.venue)));
document.querySelectorAll('[data-surface]').forEach(b=>b.addEventListener('click',()=>setSurface(b.dataset.surface)));
document.getElementById('toggleSeats').addEventListener('click',e=>{seatsVisible=!seatsVisible;seatRoot.setEnabled(seatsVisible);modelSeatRoot.setEnabled(seatsVisible);e.currentTarget.classList.toggle('active',seatsVisible);e.currentTarget.textContent='座席 '+(seatsVisible?'ON':'OFF');});
document.getElementById('toggleLights').addEventListener('click',e=>{lightsVisible=!lightsVisible;lightRoot.setEnabled(lightsVisible);e.currentTarget.classList.toggle('active',lightsVisible);e.currentTarget.textContent='照明 '+(lightsVisible?'ON':'OFF');});
document.getElementById('resetView').addEventListener('click',()=>{camera.setTarget(new BABYLON.Vector3(0,2,0));camera.alpha=-Math.PI/2.18;camera.beta=1.05;camera.radius=43;});

engine.runRenderLoop(()=>{if(scene.activeCamera)scene.render();});
window.addEventListener('resize',()=>engine.resize());
setTimeout(()=>document.getElementById('loading').classList.add('hide'),7000);
})();
</script>
</body>
</html>
