<body>
<div class="top"><div class="brand"><div class="logo">S</div><div><div class="title">SPORTS ARENA</div><div class="sub">TENNIS · 3D ENVIRONMENT PREVIEW 01</div></div></div><div class="pill">PREVIEW ONLY · NOT THE MAIN GAME</div></div>
<section class="panel"><div class="eyebrow">ENVIRONMENT / 01</div><h1>スタンダードコート</h1><p class="desc">リアル寄りの質感・照明・ネット・観客席を確認するための3D試作です。ドラッグで回転、ホイール／ピンチでズームできます。本番ゲームには接続していません。</p><div class="stats"><div class="stat"><b>23.77 m</b><span>COURT LENGTH</span></div><div class="stat"><b>10.97 m</b><span>DOUBLES WIDTH</span></div><div class="stat"><b>REALTIME</b><span>3D VIEW</span></div></div></section>
<div class="controls"><div class="row court-types"><button class="active" data-court="hard">ハード</button><button data-court="clay">クレー</button><button data-court="grass">芝</button><button data-court="indoor">インドア</button></div><div class="row"><button id="play" class="active">プレイ視点</button><button id="topview">全体俯瞰</button><button id="low">低い視点</button></div><div class="row"><button id="seats" class="active">観客席 ON</button><button id="lights" class="active">照明 ON</button><button id="reset">リセット</button></div></div>
<div class="hint">ドラッグ：視点回転　／　ピンチ・ホイール：ズーム</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fb8c5);scene.fog=new THREE.Fog(0x9fb8c5,42,100);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,180);camera.position.set(4.5,7,21);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,.6,0);orbit.enableDamping=true;orbit.dampingFactor=.06;orbit.minDistance=8;orbit.maxDistance=42;orbit.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xe8f7ff,0x36444b,2));
const sun=new THREE.DirectionalLight(0xfff1d8,3.2);sun.position.set(-12,20,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;sun.shadow.bias=-.00025;scene.add(sun);
const fill=new THREE.DirectionalLight(0x8bdcff,1.15);fill.position.set(14,10,-12);scene.add(fill);
const material=(color,roughness=.75,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
function cube(w,h,d,mat,x,y,z,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;scene.add(m);return m}
cube(70,.5,70,material(0x526b77),0,-.45,0,false);const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),material(0x7b8e90));floor.rotation.x=-Math.PI/2;floor.position.y=-.72;floor.receiveShadow=true;scene.add(floor);
const apronMat=material(0x244454,.92);cube(15.5,.12,28.3,apronMat,0,-.18,0,false);
function makeSurfaceTexture(type){const cv=document.createElement('canvas');cv.width=cv.height=1024;const g=cv.getContext('2d');const palette={hard:['#147da8','#0e739e'],clay:['#bd5a35','#a94a2c'],grass:['#36784a','#2e6b40'],indoor:['#b98b54','#a97b45']}[type];g.fillStyle=palette[0];g.fillRect(0,0,1024,1024);if(type==='grass'){for(let i=0;i<8;i++){g.fillStyle=i%2?'rgba(8,45,17,.09)':'rgba(220,255,190,.055)';g.fillRect(i*128,0,128,1024)}}if(type==='indoor'){for(let y=0;y<1024;y+=34){g.fillStyle='rgba(65,36,15,.16)';g.fillRect(0,y,1024,2);for(let x=(y%68?0:100);x<1024;x+=210){g.fillStyle='rgba(255,220,160,.07)';g.fillRect(x,y,1,34)}}}for(let i=0;i<36000;i++){const alpha=Math.random()*(type==='clay'?.12:.085);g.fillStyle=Math.random()>.5?'rgba(255,255,255,'+alpha+')':'rgba(0,0,0,'+alpha+')';const x=Math.random()*1024,y=Math.random()*1024;g.fillRect(x,y,type==='grass'?1:2,type==='grass'?4:1)}const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
const surfaceTextures={hard:makeSurfaceTexture('hard'),clay:makeSurfaceTexture('clay'),grass:makeSurfaceTexture('grass'),indoor:makeSurfaceTexture('indoor')};
const courtMaterial=new THREE.MeshStandardMaterial({map:surfaceTextures.hard,roughness:.9});
const court=new THREE.Mesh(new THREE.BoxGeometry(10.97,.16,23.77),courtMaterial);court.position.y=-.06;court.receiveShadow=true;scene.add(court);
const white=material(0xf6f7f2,.7);function line(x1,z1,x2,z2,width=.05){const dx=x2-x1,dz=z2-z1,length=Math.hypot(dx,dz),m=new THREE.Mesh(new THREE.BoxGeometry(width,.02,length),white);m.position.set((x1+x2)/2,.035,(z1+z2)/2);m.rotation.y=Math.atan2(dx,dz);m.receiveShadow=true;scene.add(m)}
const w=10.97/2,l=23.77/2,s=8.23/2;line(-w,-l,w,-l);line(-w,l,w,l);line(-w,-l,-w,l);line(w,-l,w,l);line(-s,-l,-s,l,.045);line(s,-l,s,l,.045);line(-w,-6.4,w,-6.4);line(-w,6.4,w,6.4);line(-s,0,s,0,.045);line(0,-6.4,0,6.4,.045);
for(const x of [-5.55,5.55]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,1.15,16),material(0x20343f,.35,.5));post.position.set(x,.49,0);post.castShadow=true;scene.add(post)}
const netMaterial=new THREE.LineBasicMaterial({color:0xe2e9e9,transparent:true,opacity:.72});for(let i=0;i<=100;i++){const x=-5.5+i*.11,sag=(x/5.5)**2*.12;scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,.91-sag,0),new THREE.Vector3(x,.06,0)]),netMaterial))}for(let j=0;j<=14;j++){const y=.06+j*.06,pts=[];for(let i=0;i<=100;i++){const x=-5.5+i*.11;pts.push(new THREE.Vector3(x,y-(x/5.5)**2*.12*(y/.92),0))}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),netMaterial))}cube(11.1,.08,.06,material(0xf5f5ef),0,.94,0,false);
const wire=new THREE.MeshStandardMaterial({color:0x2a414c,wireframe:true,transparent:true,opacity:.22});const seatGroup=new THREE.Group();scene.add(seatGroup);
for(const z of [-15.2,15.2]){const f=new THREE.Mesh(new THREE.BoxGeometry(16,.01,4.7),wire);f.position.set(0,2,z);scene.add(f);for(const x of [-8,0,8])cube(.07,4,.07,material(0x506874,.6,.3),x,2,z,false)}
for(const x of [-8,8]){const f=new THREE.Mesh(new THREE.BoxGeometry(.01,4,30),wire);f.position.set(x,2,0);scene.add(f)}
const seatMats=[0x285166,0x376b7b,0x24475b,0x4a7b86,0x315969].map(c=>material(c,.75));
for(const side of [-1,1])for(let row=0;row<5;row++){const z=side*(17+row*1.02),y=.1+row*.43,tier=new THREE.Mesh(new THREE.BoxGeometry(27,.4,.9),material(0x435a66));tier.position.set(0,y-.15,z);seatGroup.add(tier);for(let x=-12.8;x<=12.8;x+=.62){const seat=new THREE.Mesh(new THREE.BoxGeometry(.45,.23,.38),seatMats[Math.floor(Math.random()*seatMats.length)]);seat.position.set(x,y+.12,z);seatGroup.add(seat);const back=new THREE.Mesh(new THREE.BoxGeometry(.45,.26,.07),seatMats[Math.floor(Math.random()*seatMats.length)]);back.position.set(x,y+.27,z-side*.14);seatGroup.add(back)}}
for(const side of [-1,1]){const roof=new THREE.Mesh(new THREE.BoxGeometry(28,.3,4.5),material(0x2b414c,.5,.35));roof.position.set(0,3.3,side*22);seatGroup.add(roof)}
const spotlights=[];for(const x of [-15,15])for(const z of [-16,16]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.11,.16,8.5,12),material(0x526875,.4,.5));pole.position.set(x,4.25,z);pole.castShadow=true;scene.add(pole);cube(2.2,.18,.4,material(0x283b48,.4,.4),x,8.55,z);for(let i=0;i<5;i++){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.27,.07,.22),new THREE.MeshStandardMaterial({color:0xf0fbff,emissive:0x7bdcff,emissiveIntensity:.6}));lamp.position.set(x-.75+i*.375,8.42,z);scene.add(lamp)}const spot=new THREE.SpotLight(0xeaf8ff,2,35,Math.PI/5,.5,1.4);spot.position.set(x,8.3,z);spot.target.position.set(0,0,0);scene.add(spot,spot.target);spotlights.push(spot)}
for(const z of [-17,17]){cube(4.1,2,.18,material(0x101d26,.3,.4),0,3,z);const screen=new THREE.Mesh(new THREE.PlaneGeometry(3.8,1.7),new THREE.MeshStandardMaterial({color:0x082b3a,emissive:0x0b536a,emissiveIntensity:.55}));screen.position.set(0,3,z+(z<0?.1:-.1));if(z>0)screen.rotation.y=Math.PI;scene.add(screen)}
for(const z of [-13.7,13.7]){cube(4,.15,.45,material(0x2a424c,.5,.3),0,.27,z);for(const x of [-1.6,1.6])cube(.12,.45,.12,material(0x263a44,.5,.3),x,.03,z)}
const ball=new THREE.Mesh(new THREE.SphereGeometry(.17,24,18),material(0xd8ed5c,.55));ball.position.set(-2.5,.28,3.2);ball.castShadow=true;scene.add(ball);for(let i=0;i<2;i++){const seam=new THREE.Mesh(new THREE.TorusGeometry(.12,.006,5,36),new THREE.MeshBasicMaterial({color:0xf7ffbe}));seam.scale.set(1,.68,1);seam.rotation.set(.7+i*.6,.4+i*.7,.3);ball.add(seam)}
function view(v){orbit.target.set(0,.6,0);if(v==='play'){camera.position.set(4.5,7,21);orbit.target.set(0,.6,-1.2)}else if(v==='top'){camera.position.set(0,25,3.8)}else{camera.position.set(0,2.6,22)}orbit.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
[['play','play'],['topview','top'],['low','low']].forEach(([id,v])=>{document.getElementById(id).dataset.view=v;document.getElementById(id).onclick=()=>view(v)});
const courtStyles={hard:{apron:0x244454,title:'ハードコート'},clay:{apron:0x7d3827,title:'クレーコート'},grass:{apron:0x254d35,title:'芝コート'},indoor:{apron:0x6e5134,title:'インドアコート'}};
function setCourtType(type){if(!surfaceTextures[type])return;courtMaterial.map=surfaceTextures[type];courtMaterial.needsUpdate=true;apronMat.color.setHex(courtStyles[type].apron);document.querySelectorAll('[data-court]').forEach(b=>b.classList.toggle('active',b.dataset.court===type));document.querySelector('.panel h1').textContent=courtStyles[type].title;document.querySelector('.panel .eyebrow').textContent='ENVIRONMENT / '+({hard:'01',clay:'02',grass:'03',indoor:'04'}[type]);}
document.querySelectorAll('[data-court]').forEach(b=>b.addEventListener('click',()=>setCourtType(b.dataset.court)));
let seatsOn=true,lightsOn=true;document.getElementById('seats').onclick=e=>{seatsOn=!seatsOn;seatGroup.visible=seatsOn;e.currentTarget.classList.toggle('active',seatsOn);e.currentTarget.textContent='観客席 '+(seatsOn?'ON':'OFF')};document.getElementById('lights').onclick=e=>{lightsOn=!lightsOn;spotlights.forEach(s=>s.intensity=lightsOn?2:0);e.currentTarget.classList.toggle('active',lightsOn);e.currentTarget.textContent='照明 '+(lightsOn?'ON':'OFF')};document.getElementById('reset').onclick=()=>{view('play');orbit.reset()};
function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;if(innerWidth<innerHeight&&innerWidth<=800){camera.fov=55;camera.position.set(0,12,27);orbit.target.set(0,.6,0)}else{camera.fov=43}camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));orbit.update()});if(innerWidth<innerHeight&&innerWidth<=800){camera.fov=55;camera.position.set(0,12,27);camera.updateProjectionMatrix();orbit.target.set(0,.6,0);orbit.update()}
</script>
