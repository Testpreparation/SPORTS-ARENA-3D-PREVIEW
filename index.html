<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体育館 3Dモデル プレビュー</title>
<style>
  html,body{margin:0;height:100%;background:#12151b;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:#fff}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;left:0;right:0;top:0;padding:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
  #ui button{pointer-events:auto;border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;color:#fff;background:rgba(20,28,44,.82);backdrop-filter:blur(6px);cursor:pointer}
  #ui button.on{background:#2f7bff}
  #hint{position:fixed;left:10px;bottom:10px;font-size:12px;opacity:.7;pointer-events:none}
  #load{position:fixed;inset:0;display:grid;place-items:center;background:#12151b;font-size:15px;letter-spacing:.05em}
</style>
</head>
<body>
<div id="load">モデルを生成中…</div>
<div id="ui">
  <button data-v="all" class="on">体育館 全景</button>
  <button data-v="vb">バレーコート</button>
  <button data-v="ref">ネット・審判台</button>
  <button data-v="tt">卓球エリア</button>
  <button data-v="table">卓球台</button>
  <button id="net">ネット: 男子 2.43m</button>
  <button id="q">画質: 高</button>
</div>
<div id="hint">ドラッグ: 回転 / ホイール・ピンチ: ズーム / Shift+ドラッグ・右ドラッグ: 移動</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*!

 *
 * 座標系は BADMINTON ARENA に合わせています:
 *   Y = 上 / ネットは z=0 で x 方向に張る / コートの長手方向は z 軸 / 単位はメートル / 原点はコート中心の床面
 *
 * 主なAPI (window.GymModels):
 *   buildVolleyballCourt(opts)   バレーコート一式(床・ライン・ネット・支柱・アンテナ・審判台・記録台・ベンチ・ボールカート)
 *   buildTableTennisTable(opts)  卓球台1台(ネット・クランプ・脚・キャスター)
 *   buildTableTennisZone(opts)   卓球エリア(マット・バリア・卓球台×n・フリップ得点板・タオルボックス)
 *   buildGymHall(opts)           体育館本体(床・壁・窓・屋根・トラス・照明・ギャラリー・電光掲示板・ゴール)
 *   buildGymComplex(opts)        上記をまとめて配置した完成版
 *   createVolleyball() / createTableTennisBall() / createPaddle()   小物
 */
(function (root) {
'use strict';
var THREE = root.THREE || (typeof require === 'function' ? require('three') : null);

/* ============================================================
 *  ユーティリティ
 * ============================================================ */
var QUALITY = {
  high:   { wood: 2048, court: [2048, 4096], ball: 1024, board: 1024, aniso: 8, shadow: 4096 },
  normal: { wood: 1024, court: [1024, 2048], ball: 512,  board: 512,  aniso: 4, shadow: 2048 }
};
function getQ(name) { return QUALITY[name] || QUALITY.high; }

function rng(seed) {                     // 再現性のある乱数 (mulberry32)

/* ジオメトリ結合 (ドローコール削減) */

Merger.prototype.build = function (mat, cast) {

  g.setAttribute('uv', new THREE.Float32BufferAttribute(this.u, 2));
  g.setIndex(this.o > 65535 ? new THREE.BufferAttribute(new Uint32Array(this.i), 1) : this.i);

};

}
function mCyl(mg, r, h, x, y, z, rx, rz, seg) {

  mg.add(new THREE.CylinderGeometry(r, r, h, seg || 12), _m);
}
function mLink(mg, a, b, w, round) {
  _d.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
  var len = _d.length();
  if (len < 1e-6) return;

  _m.compose(_p.set((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2), _q, _s);
  mg.add(round ? new THREE.CylinderGeometry(w / 2, w / 2, len, 8) : new THREE.BoxGeometry(w, len, w), _m);
}
function scaleUV(geo, u, v) {
  var a = geo.attributes.uv;
  for (var i = 0; i < a.count; i++) a.setXY(i, a.getX(i) * u, a.getY(i) * v);
  a.needsUpdate = true;

}
function quadGeo(p0, p1, p2, p3, uRep, vRep) {      // 4頂点→1枚板
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p0.concat(p1, p2, p3), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, uRep, 0, uRep, vRep, 0, vRep], 2));

function textTex(w, h, draw, o) { var c = canvas(w, h), g = c.getContext('2d'); draw(g, w, h); return ctex(c, o); }

/* ============================================================
 *  テクスチャ
 * ============================================================ */
/* 木床の板張り (板は縦方向に走る) */
function drawPlanks(g, x0, y0, w, h, o, r) {
  var x, y, len, ya, yb, l, n, i, gx, gy, pw;
  for (x = x0; x < x0 + w - 0.5; x += o.pw) {
    pw = Math.min(o.pw, x0 + w - x);
    y = y0 - r() * o.seg;
    while (y < y0 + h) {
      len = o.seg * (0.55 + r() * 0.7);
      ya = Math.max(y, y0); yb = Math.min(y + len, y0 + h);
      if (yb > ya) {
        l = o.l + (r() - 0.5) * o.lv;
        g.fillStyle = 'hsl(' + (o.h + (r() - 0.5) * 3) + ',' + o.s + '%,' + l + '%)';
        g.fillRect(x, ya, pw, yb - ya);
        n = Math.max(2, Math.round(o.grain * pw / 6));
        for (i = 0; i < n; i++) {
          gx = x + r() * pw;
          g.strokeStyle = r() > 0.5 ? 'rgba(110,62,24,' + (0.04 + r() * 0.07) + ')' : 'rgba(255,238,205,' + (0.04 + r() * 0.08) + ')';
          g.lineWidth = 0.5 + r() * 1.1;
          g.beginPath(); g.moveTo(gx, ya); gy = ya;
          while (gy < yb) { gy += 12 + r() * 30; g.lineTo(gx + (r() - 0.5) * 1.4, Math.min(gy, yb)); }
          g.stroke();
        }
        g.fillStyle = 'rgba(48,26,8,0.38)'; g.fillRect(x, ya, pw, Math.max(1, o.pw * 0.06));
      }
      y += len;
    }
    g.fillStyle = 'rgba(48,26,8,0.30)'; g.fillRect(x, y0, Math.max(1, o.pw * 0.05), h);
  }
}
function woodTile(q, repeat) {                      // 体育館床 (8m角タイル)
  var N = q.wood, c = canvas(N, N), g = c.getContext('2d'), px = N / 8;
  drawPlanks(g, 0, 0, N, N, { pw: 0.08 * px, seg: 2.4 * px, h: 33, s: 50, l: 60, lv: 7, grain: 10 }, rng(11));
  return ctex(c, { aniso: q.aniso, rep: repeat });
}
function plasterTex() {
  var c = canvas(256, 256), g = c.getContext('2d'), r = rng(5), i;
  g.fillStyle = '#e8e2d2'; g.fillRect(0, 0, 256, 256);
  for (i = 0; i < 2600; i++) { g.fillStyle = 'rgba(' + (r() > 0.5 ? '120,110,90' : '255,255,255') + ',' + (0.03 + r() * 0.05) + ')'; g.fillRect(r() * 256, r() * 256, 2 + r() * 3, 2 + r() * 3); }
  return ctex(c, { rep: [1, 1], aniso: 4 });
}
function padTex() {                                 // 壁下部のクッション
  var c = canvas(256, 256), g = c.getContext('2d'), r = rng(9), i;
  g.fillStyle = '#16335f'; g.fillRect(0, 0, 256, 256);
  for (i = 0; i < 1800; i++) { g.fillStyle = 'rgba(255,255,255,' + (0.02 + r() * 0.03) + ')'; g.fillRect(r() * 256, r() * 256, 2, 2); }
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, 3, 256); g.fillRect(0, 0, 256, 3);
  g.fillStyle = 'rgba(255,255,255,.10)'; g.fillRect(3, 3, 2, 253); g.fillRect(3, 3, 253, 2);
  return ctex(c, { rep: [1, 1], aniso: 4 });
}
function windowTex() {
  return textTex(256, 128, function (g, w, h) {
    var gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#9fc6ee'); gr.addColorStop(0.6, '#d9ecfb'); gr.addColorStop(1, '#ffffff');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#6c7480'; g.fillRect(0, 0, w, 5); g.fillRect(0, h - 5, w, 5); g.fillRect(0, 0, 4, h); g.fillRect(w - 4, 0, 4, h); g.fillRect(0, h / 2 - 2, w, 4);

}
function roofTex() {
  return textTex(128, 32, function (g, w, h) {

  }, { rep: [1, 1], aniso: 4 });
}

  g.clearRect(0, 0, 64, 64); g.fillStyle = color;
  g.fillRect(0, 0, 64, line); g.fillRect(0, 0, line, 64);

}

  return ctex(c, { rep: [1, 9], aniso: 4 });
}

  return textTex(w, h, function (g) {
    var gr = g.createLinearGradient(0, 0, w, 0);
    gr.addColorStop(0, bg[0]); gr.addColorStop(1, bg[1]);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(0, h * 0.82, w, h * 0.04);
    g.fillStyle = fg; g.textBaseline = 'middle'; g.textAlign = 'left';
    g.font = 'italic 900 ' + Math.round(h * 0.46) + 'px system-ui,sans-serif'; g.fillText('RACKET STARS', h * 0.3, h * 0.42);
    g.font = '700 ' + Math.round(h * 0.2) + 'px system-ui,sans-serif'; g.fillStyle = '#fff'; g.fillText(sub || '★ PRO TOUR', h * 0.32, h * 0.76);
    if (text) { g.textAlign = 'right'; g.font = '900 ' + Math.round(h * 0.34) + 'px system-ui,sans-serif'; g.fillStyle = fg; g.fillText(text, w - h * 0.3, h * 0.5); }
  }, { aniso: 4 });

/* ============================================================
 *  バレーボール (ボール)
 * ============================================================ */
function volleyTexture(q, bump) {

  g.fillStyle = bump ? '#a0a0a0' : '#f4cf2a'; g.fillRect(0, 0, W, H);

    shift = Math.sin(y / H * Math.PI * 2) * W * 0.03;

      grp = Math.floor(k / 3); pal = (grp % 2 === 0) ? ['#1d5fc0', '#f4cf2a', '#1d5fc0'] : ['#f4cf2a', '#1d5fc0', '#f4cf2a'];
      x0 = ((k * sw + shift) % W + W) % W;
      g.fillStyle = bump ? '#a8a8a8' : pal[k % 3];
      g.fillRect(x0, y, sw + 1, 1);

      g.fillStyle = bump ? '#2a2a2a' : 'rgba(25,25,25,.55)';
      g.fillRect(x0, y, Math.max(1.5, W / 600), 1);

var _volleyCache = {};

      mat: S(0xffffff, { map: volleyTexture(q, false), bumpMap: volleyTexture(q, true), bumpScale: 0.9, roughness: 0.5 })
    };

/* ============================================================
 *  バレーボールコート
 * ============================================================ */
function courtTexture(q, hw, hl, fzS, fzE) {
  var W = 2 * hw + 2 * fzS, L = 2 * hl + 2 * fzE, cw = q.court[0], ch = q.court[1],
      sx = cw / W, sz = ch / L, c = canvas(cw, ch), g = c.getContext('2d'), r = rng(7), i, s;
  function X(m) { return (m + W / 2) * sx; }
  function Z(m) { return (m + L / 2) * sz; }

    drawPlanks(g, X(x0), Z(z0), (x1 - x0) * sx, (z1 - z0) * sz, { pw: 0.07 * sx, seg: 2.4 * sz, h: hh, s: 52, l: ll, lv: 6, grain: 10 }, r);
  }
  function rect(x0, z0, x1, z1) { g.fillRect(X(x0), Z(z0), (x1 - x0) * sx, (z1 - z0) * sz); }

  wood(-hw, -hl, hw, hl, 34, 66);

  rect(-hw, 3 - lw, hw, 3); rect(-hw, -3, hw, -3 + lw);                     // アタックライン(3m)

    for (i = 0; i < 5; i++) {                                                // アタックライン延長(破線)

      rect(s > 0 ? xa : -xa - 0.15, 3 - lw, s > 0 ? xa + 0.15 : -xa, 3);
      rect(s > 0 ? xa : -xa - 0.15, -3, s > 0 ? xa + 0.15 : -xa, -3 + lw);
    }
    rect(s > 0 ? hw - lw : -hw, hl + 0.2, s > 0 ? hw : -hw + lw, hl + 0.35);       // サーブゾーン短線

function buildNet(hw, netH) {
  var G = new THREE.Group(); G.name = 'VolleyballNet'; G.position.y = netH;        // 子要素はネット上端=0基準

  var mesh = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 1),

  mesh.position.y = -0.5; G.add(mesh);                                              // ネットは影を落とさない
  box(G, 9.5, 0.07, 0.018, white, 0, -0.035, 0, false);                             // 上部白帯 7cm
  box(G, 9.5, 0.05, 0.012, white, 0, -0.975, 0, false);                             // 下部白帯 5cm
  var stripes = S(0xffffff, { map: stripeTex(), roughness: 0.5 });
  [-1, 1].forEach(function (s) {

  G.userData = { hall: hall, volleyball: vb, tableTennis: tt };
  return G;
}

/* 任意: 既存シーンを屋内向けに調整 */
function applyIndoorLook(scene, opts) {
  opts = opts || {};
  scene.background = new THREE.Color(0x1a1e27); scene.fog = null;
  if (opts.sun) { opts.sun.intensity = 0.0; }
  if (opts.hemi) { opts.hemi.intensity = 0.2; }
}

var API = {
  buildVolleyballCourt: buildVolleyballCourt, buildTableTennisTable: buildTableTennisTable,
  buildTableTennisZone: buildTableTennisZone, buildGymHall: buildGymHall, buildGymComplex: buildGymComplex,
  createVolleyball: createVolleyball, createTableTennisBall: createTableTennisBall, createPaddle: createPaddle,
  applyIndoorLook: applyIndoorLook
};
root.GymModels = API;
if (typeof module !== 'undefined' && module.exports) { module.exports = API; }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1e27);
const camera=new THREE.PerspectiveCamera(58,1,.1,200);

let complex=null,quality='high',men=true;
function build(){
  if(complex){scene.remove(complex);}
  complex=GymModels.buildGymComplex({quality});
  scene.add(complex);
  complex.userData.volleyball.userData.setNetHeight(men?2.43:2.24);
}

/* ---- 簡易オービットコントロール ---- */
const st={t:new THREE.Vector3(3,1.5,0),r:30,th:.9,ph:1.2};
const goal={t:st.t.clone(),r:st.r,th:st.th,ph:st.ph};
function setCam(){
  camera.position.set(st.t.x+st.r*Math.sin(st.ph)*Math.sin(st.th),st.t.y+st.r*Math.cos(st.ph),st.t.z+st.r*Math.sin(st.ph)*Math.cos(st.th));
  camera.lookAt(st.t);
}
function from(px,py,pz,tx,ty,tz){
  const d=new THREE.Vector3(px-tx,py-ty,pz-tz),r=d.length();
  goal.t.set(tx,ty,tz);goal.r=r;goal.th=Math.atan2(d.x,d.z);goal.ph=Math.acos(d.y/r);
}
const V={
  all:()=>from(-17,8,17,3,2,0),
  vb:()=>from(-9,4.2,13,0,1.2,0),
  ref:()=>from(-9.5,2.8,4.5,-5,1.7,0),
  tt:()=>from(8.5,5.2,10.5,13.9,.8,0),
  table:()=>from(13.7,1.9,-.9,11.75,.8,-3.7)
};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('on'));b.classList.add('on');V[b.dataset.v]();
});
V.all();Object.assign(st,{r:goal.r,th:goal.th,ph:goal.ph});st.t.copy(goal.t);

let drag=null;const pts=new Map();let pinch=0;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===2};});
el.addEventListener('pointerup',e=>{pts.delete(e.pointerId);drag=null;pinch=0;});
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)goal.r=Math.max(1.2,Math.min(70,goal.r*pinch/d));pinch=d;return;}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(drag.pan){const k=goal.r*.0016,right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);goal.t.addScaledVector(right,-dx*k);goal.t.y+=dy*k;}
  else{goal.th-=dx*.006;goal.ph=Math.max(.15,Math.min(Math.PI*.49,goal.ph-dy*.006));}
});
el.addEventListener('wheel',e=>{e.preventDefault();goal.r=Math.max(1.2,Math.min(70,goal.r*Math.exp(e.deltaY*.001)));},{passive:false});

document.getElementById('net').onclick=function(){men=!men;this.textContent=men?'ネット: 男子 2.43m':'ネット: 女子 2.24m';complex.userData.volleyball.userData.setNetHeight(men?2.43:2.24);};
document.getElementById('q').onclick=function(){quality=quality==='high'?'normal':'high';this.textContent='画質: '+(quality==='high'?'高':'標準');document.getElementById('load').style.display='grid';setTimeout(()=>{build();document.getElementById('load').style.display='none';},30);};

function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

setTimeout(()=>{build();document.getElementById('load').style.display='none';},30);
(function loop(){
  requestAnimationFrame(loop);
  const k=.12;st.t.lerp(goal.t,k);st.r+=(goal.r-st.r)*k;st.th+=(goal.th-st.th)*k;st.ph+=(goal.ph-st.ph)*k;
  setCam();renderer.render(scene,camera);
})();
})();
</script>
</body>
</html>
