name: Build Blender Arena GLB
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/generate_arena.py'
      - '.github/workflows/build-blender-model.yml'
permissions:
  contents: write
concurrency:
  group: blender-arena-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Generate GLB from Blender scene
        run: |
          mkdir -p assets
          blender --background --python tools/blender/generate_arena.py -- --output assets/arena.glb
          test -s assets/arena-architecture.glb
          test -s assets/arena-seats.glb
          ls -lh assets/arena-architecture.glb assets/arena-seats.glb
      - name: Commit generated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/arena-architecture.glb assets/arena-seats.glb
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Build Blender arena GLB model"
            git push
          fi
